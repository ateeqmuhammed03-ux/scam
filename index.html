<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- ========================================
         BROWSER TITLE
    ======================================== -->

    <title>Scam</title>


    <!-- ========================================
         WHATSAPP / SOCIAL MEDIA PREVIEW
    ======================================== -->

    <meta
        property="og:title"
        content="Scam"
    >

    <meta
        property="og:type"
        content="website"
    >

    <meta
        property="og:site_name"
        content="Scam"
    >

    <meta
        property="og:description"
        content=""
    >


    <!-- ========================================
         TWITTER / OTHER SOCIAL PREVIEW
    ======================================== -->

    <meta
        name="twitter:card"
        content="summary"
    >

    <meta
        name="twitter:title"
        content="Scam"
    >


    <!-- ========================================
         CSS
    ======================================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- ========================================
         MAIN CARD
    ======================================== -->

    <div class="card">


        <!-- ROMANTIC IMAGE -->

        <div class="romantic-image">

            <img
                src="romantic-place.png"
                alt="Romantic place"
            >

        </div>


        <!-- QUESTION -->

        <h1>
            🌸 Will you go out with me? 🌸
        </h1>


        <!-- ========================================
             YES / NO BUTTONS
        ======================================== -->

        <div class="buttons">


            <!-- YES -->

            <button id="yesButton">

                YES ❤️

            </button>


            <!-- NO -->

            <button id="noButton">

                NO 🐾

            </button>


        </div>


    </div>


    <!-- ========================================
         JAVASCRIPT
    ======================================== -->

    <script src="script.js"></script>


</body>

</html>
